name: Feature proposal
description: Describe a user problem and a focused improvement.
title: "[Feature] "
body:
    - type: textarea
      id: problem
      attributes:
          label: User problem
          description: Who needs this, in what situation, and what is difficult today?
      validations:
          required: true
    - type: textarea
      id: proposal
      attributes:
          label: Proposed behavior
          description: Include a concrete example and what success would look like.
      validations:
          required: true
    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives and constraints
          description: Consider privacy, accessibility, educational validity, and model limits.
